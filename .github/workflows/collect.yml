name: 주간 사용량 수집

on:
  schedule:
    - cron: '0 0 * * 5'   # 매주 금요일 09:00 KST (UTC 00:00)
  workflow_dispatch:
    inputs:
      week_start:
        description: '재수집할 주의 월요일 (YYYY-MM-DD). 비우면 이번 주'
        required: false
        default: ''

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 수집 실행
        run: node scripts/collect.mjs
        env:
          CLOUDIKE_API_BASE: ${{ vars.CLOUDIKE_API_BASE }}
          CLOUDIKE_API_TOKEN: ${{ secrets.CLOUDIKE_API_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WEEK_START: ${{ inputs.week_start }}
          TRIGGER: ${{ github.event_name }}
